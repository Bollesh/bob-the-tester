[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "bob-the-tester"
version = "0.1.0"
description = "AI-powered test generation and QA framework — IBM SkillsBuild Hackathon"
requires-python = ">=3.11"
dependencies = [
    # MCP server SDK (STDIO transport).
    # Upper bound is required: mcp 2.x removed the @app.list_tools() /
    # @app.call_tool() decorator API that server/main.py is written against
    # (it is gone from mcp.server.lowlevel too, not merely relocated).
    "mcp>=1.0,<2",
    # Schema / validation
    "pydantic>=2.0",
    # Test runner + coverage
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # XML parsing (stdlib ET is fine, but lxml is faster for large reports)
    "lxml>=5.0",
    # Safer XML parsing
    "defusedxml>=0.7",
]

[project.optional-dependencies]
# P2 pipeline tools
pipeline = [
    "hypothesis>=6.100",
    # mutmut 3.x only: server/pipeline/mutation.py uses the 3.x config keys
    # (source_paths / only_mutate) and the 3.x results CLI.  2.x differs on
    # both and would be misparsed; the tool version-guards against it.
    "mutmut>=3.0",
    "pytest-rerunfailures>=14.0",
]
# P4 dashboard
dashboard = [
    "streamlit>=1.35",
]
# Install everything
dev = [
    "bob-the-tester[pipeline,dashboard]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[project.scripts]
bob-the-tester-server = "server.main:main"

[tool.pytest.ini_options]
# There is no tests/ directory at the repo root — the suite under test lives
# in the demo target.  Pointing at a non-existent path made a bare `pytest`
# from the repo root collect nothing.
testpaths = ["sample_repo/tests"]
addopts = "-v --tb=short"
