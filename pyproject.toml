[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "bob-the-tester"
version = "0.1.0"
description = "AI-powered test generation and QA framework — IBM SkillsBuild Hackathon"
requires-python = ">=3.11"
dependencies = [
    # MCP server SDK (STDIO transport)
    "mcp>=1.0.0",
    # Schema / validation
    "pydantic>=2.0",
    # Test runner + coverage
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # XML parsing (stdlib ET is fine, but lxml is faster for large reports)
    "lxml>=5.0",
    # Safer XML parsing
    "defusedxml>=0.7",
]

[project.optional-dependencies]
# P2 pipeline tools
pipeline = [
    "hypothesis>=6.100",
    "mutmut>=2.4",
    "pytest-rerunfailures>=14.0",
]
# P4 dashboard
dashboard = [
    "streamlit>=1.35",
]
# Install everything
dev = [
    "bob-the-tester[pipeline,dashboard]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[project.scripts]
bob-the-tester-server = "server.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
